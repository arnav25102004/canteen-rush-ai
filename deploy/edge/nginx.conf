# Edge cache and load balancer for the API. Mount the API servers at
# /etc/nginx/upstreams.conf, one line each: `server api-1:3001 max_fails=3 fail_timeout=5s;`
worker_processes auto;
worker_rlimit_nofile 200000;
events { worker_connections 50000; multi_accept on; }

http {
  access_log off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 100000;
  client_max_body_size 6m;
  open_file_cache max=20000 inactive=30s;
  open_file_cache_valid 5s;

  upstream api {
    least_conn;
    include /etc/nginx/upstreams.conf;
    keepalive 1024;
  }
  # A socket stays on one API server for its whole session.
  upstream api_sockets {
    hash $remote_addr consistent;
    include /etc/nginx/upstreams.conf;
  }

  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:64m max_size=1g inactive=10m use_temp_path=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  server {
    listen 80 reuseport backlog=65535;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /socket.io/ {
      proxy_pass http://api_sockets;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 75s;
    }

    # Public catalog only. Everything else goes straight to the API, because waiting on a
    # cache lock for a response that cannot be stored would delay it.
    location ~ ^/api(/v1)?/(canteens(/(?!search$|my$)[^/]+(/(menu|live-stats))?)?|institutions/[^/]+/canteens)$ {
      proxy_pass http://api;
      proxy_cache api_cache;
      proxy_cache_methods GET HEAD;
      proxy_cache_key "$request_method|$host|$uri";
      proxy_cache_bypass $http_authorization $args;
      proxy_no_cache $http_authorization $args;
      proxy_cache_lock on;
      proxy_cache_lock_timeout 2s;
      proxy_cache_background_update on;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      add_header X-Edge-Cache $upstream_cache_status always;
    }

    location / {
      proxy_pass http://api;
    }
  }
}
