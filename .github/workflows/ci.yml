name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (typecheck, migrations, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: canteen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d canteen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/canteen_test
      # Enables the real-Postgres money-path integration suites.
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/canteen_test
      # Test-only value: there is no .env on the runner.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Proves every migration applies cleanly to an empty database.
      - run: npx prisma migrate deploy
      - name: Schema matches migrations
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx next build

  mobile:
    name: Mobile (typecheck, expo-doctor, bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo-doctor
      # Builds the production JS bundle; catches import/Metro errors without a native build.
      - run: npx expo export --platform android --output-dir /tmp/expo-export
