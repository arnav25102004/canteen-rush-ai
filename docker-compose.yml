services:
  postgres:
    image: postgres:16-alpine
    container_name: christ_canteen_postgres
    network_mode: host
    environment:
      POSTGRES_DB: christ_canteen
      POSTGRES_USER: canteen_user
      POSTGRES_PASSWORD: canteen_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteen_user -d christ_canteen"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: christ_canteen_redis
    network_mode: host
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
