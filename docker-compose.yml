version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: christ_canteen_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: christ_canteen
      POSTGRES_USER: canteen_user
      POSTGRES_PASSWORD: canteen_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteen_user -d christ_canteen"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: christ_canteen_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7-jammy
    container_name: christ_canteen_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  redisdata:
  mongodata:
